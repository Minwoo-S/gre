    $('#btnAutoFillGuide')?.addEventListener('click', () => {
      const iss = M.issues.find(x => x.num === curNum);
      const g = iss?.guide;
      if (!g) return;
      const getExBlock = (n) => {
        const d = W_DRILLS.find(x => x.id === 'ex_' + n);
        return d ? d.sentences.map(s => s.en).join(' ') : '';
      };
      const b1Block = getExBlock(g.b1_num);
      const b2Block = getExBlock(g.b2_num);
      const b3Block = getExBlock(g.b3_num);
      const autoOutline = `[입장] ${g.stance}\n[핵심 테제] ${g.thesis_ko}\n[본론 1 (양보)] ${g.b1_ex} — ${g.b1_plan}\n[본론 2 (주력 1)] ${g.b2_ex} — ${g.b2_plan}\n[본론 3 (주력 2)] ${g.b3_ex} — ${g.b3_plan}`;
      const autoEssay = `The assertion that ${g.disagree_en} warrants rigorous scrutiny, as it is laden with appreciable merits yet fraught with profound limitations. While proponents contend that [상대방 측 논리 1줄], skeptics counter that such a view is overly myopic and reductionist. Although the claim holds contingent validity in narrow contexts, I fundamentally disagree with the monolithic premise that ${g.disagree_en}. Instead, a discerning examination reveals that ${g.thesis_en}.

Admittedly, in certain specialized or formative contexts, [상대방 입장이 맞을 수 있는 조건] can serve as a pragmatic expedient. For instance, consider the case of [양보 사례 연결]. ${b1Block} This illustrates that under these particular constraints, the merits of [상대방 주장 명사구] cannot be entirely dismissed.

However, when extrapolated to a broader paradigm, ${b2Block} Thus, this empirical case corroborates that [프롬프트 원문 키워드로 연결(Tie-back)].

Furthermore, from an overarching societal perspective, ${b3Block} Ultimately, this phenomenon epitomizes how [프롬프트 원문 키워드로 연결(Tie-back)].

In conclusion, treating this proposition as an immutable axiom—or dismissing it altogether—rests on a false dichotomy. While [양보 조건 요약] may prove efficacious in isolated instances, its indiscriminate application is ultimately untenable. Not only does [단수주어 + 동사원형: 내 핵심 근거 1], but it also [단수동사(-s/es): 내 핵심 근거 2]. If implemented indiscriminately, such an approach would precipitate severe unintended consequences, ranging from institutional stagnation to broader societal inefficiency.`;
      if (!essEl.value.trim() || confirm('이 문항 맞춤 서론 주장과 본론 1·2·3 추천 만능예시 영어 원문이 채워진 초안을 에세이 창에 넣을까요?')) {
        outEl.value = autoOutline;
        essEl.value = autoEssay;
        saveW();
      }
    });
  } else if (pref.wSubTab === 'map') {
    $('#wMapSelCat')?.addEventListener('change', e => { pref.wMapCat = e.target.value; savePref(); render(); });
    $('#wMapSelType')?.addEventListener('change', e => { pref.wMapType = e.target.value; savePref(); render(); });
    $('#wMapSelEx')?.addEventListener('change', e => { pref.wMapEx = e.target.value; savePref(); render(); });
    const qInp = $('#wMapSearch');
    if (qInp) {
      qInp.addEventListener('input', e => {
        pref.wMapQ = e.target.value;
        savePref();
        const pos = qInp.selectionStart;
        render();
        const nq = $('#wMapSearch');
        if (nq) { nq.focus(); nq.setSelectionRange(pos, pos); }
      });
    }
    view.querySelectorAll('.w-map-go-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const num = Number(btn.dataset.inum);
        const iss = M.issues.find(x => x.num === num);
        pref.wCat = 'all';
        pref.wType = 'all';
        pref.activeIssue = num;
        pref.wSubTab = 'pool';
        if (iss?.guide && (!wStore[num] || !wStore[num].outline)) {
          const g = iss.guide;
          wStore[num] = wStore[num] || { outline: '', essay: '' };
          wStore[num].outline = `[입장] ${g.stance}\n[핵심 테제] ${g.thesis_ko}\n[본론 1 (양보)] ${g.b1_ex} — ${g.b1_plan}\n[본론 2 (주력 1)] ${g.b2_ex} — ${g.b2_plan}\n[본론 3 (주력 2)] ${g.b3_ex} — ${g.b3_plan}`;
          saveJSON(SK_WRITING, wStore);
        }
        savePref();
        render();
        window.scrollTo(0, 0);
      });
    });
  }
}

/* ---------- Modals ---------- */
function openSearchModal() {
  const ov = $('#modalOverlay'), box = $('#modalContent');
  ov.classList.remove('hidden');
  box.innerHTML = `
    <div class="panel-title">
      <span>🔍 전체 단어 검색</span>
      <button class="btn ghost sm" id="closeModal">닫기 ✕</button>
    </div>
    <input class="input" id="searchInp" style="width:100%;font-size:16px;padding:10px 14px;margin-bottom:12px" placeholder="영단어, 한글 뜻, 동의어 입력...">
    <div id="searchRes" style="max-height:65vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px"></div>
  `;
  $('#closeModal').addEventListener('click', () => ov.classList.add('hidden'));
  const inp = $('#searchInp'), res = $('#searchRes');
  inp.focus();
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    if (q.length < 2) { res.innerHTML = ''; return; }
    const hits = [];
    const seen = new Set();
    for (const [tname, arr] of [['강쌤', M.kang], ['거만어', M.geom], ['Verbal', M.verbal], ['Quant', M.quant]]) {
      for (const x of arr) {
        if (hits.length >= 40) break;
        const key = `${tname}:${x.word}`;
        if (seen.has(key)) continue;
        if (x.word.toLowerCase().includes(q) || (x.meaning||'').toLowerCase().includes(q) || (x.synonyms||'').toLowerCase().includes(q)) {
          seen.add(key);
          hits.push({ tname, x });
        }
      }
    }
    res.innerHTML = hits.map(({tname, x}) => `
      <div class="fc-box" style="margin:0">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><b style="font-size:16px">${esc(x.word)}</b> <span style="color:var(--muted);font-size:12px">${esc(x.pron||'')}</span></div>
          <span class="badge">${tname} ${x.freq?`· 기출 ${x.freq}회`:''}</span>
        </div>
        <div style="font-weight:700;margin-top:3px">${esc(x.meaning)}</div>
        ${x.synonyms ? `<div style="font-size:12px;color:var(--brand2);margin-top:2px">🔗 ${esc(x.synonyms)}</div>` : ''}
      </div>
    `).join('') || '<div style="color:var(--muted)">결과 없음</div>';
  });
}

function openSyncModal() {
  const ov = $('#modalOverlay'), box = $('#modalContent');
  ov.classList.remove('hidden');
  box.innerHTML = `
    <div class="panel-title">
      <span>📱 아이폰 사파리(Safari) 연동 & 백업</span>
      <button class="btn ghost sm" id="closeModal">닫기 ✕</button>
    </div>
    <div class="fc-box" style="margin-bottom:12px">
      <div class="lbl">방법 1. 같은 Wi-Fi에서 아이폰 사파리로 바로 접속 (실시간 자동 연동!)</div>
      <div style="font-size:13.5px;margin-top:4px">
        아이폰 사파리 주소창에 아래 주소를 입력하면 앱이 바로 열리며, 사파리 하단 <b>[공유 ⬆️ → 홈 화면에 추가]</b>를 누르면 바탕화면 앱처럼 쓸 수 있습니다.<br>
        👉 <b style="font-size:16px;color:var(--brand)">http://192.168.219.114:8765</b>
      </div>
    </div>
    <div class="fc-box" style="margin-bottom:12px">
      <div class="lbl">방법 2. 외출/이동 시 파일로 기록 백업·복원</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
        <button class="btn sm" id="btnExportAll">📤 학습 기록 저장 (.json)</button>
        <label class="btn ghost sm" style="cursor:pointer">
          📥 기록 불러오기 (.json)
          <input type="file" id="inpImportFile" accept=".json" style="display:none">
        </label>
      </div>
    </div>
  `;
  $('#closeModal').addEventListener('click', () => ov.classList.add('hidden'));
  $('#btnExportAll').addEventListener('click', () => {
    const payload = { exportedAt: new Date().toISOString(), prog, wStore, vprobStore, pref };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'}));
    a.download = `GRE_단어장기록_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  });
  $('#inpImportFile').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (d.prog) { prog = Object.assign(prog, d.prog); saveJSON(SK_PROG, prog); }
        if (d.wStore) { wStore = Object.assign(wStore, d.wStore); saveJSON(SK_WRITING, wStore); }
        if (d.vprobStore) { vprobStore = Object.assign(vprobStore, d.vprobStore); saveJSON(SK_VPROB, vprobStore); }
        pushServerSync();
        alert('복원 완료!');
        ov.classList.add('hidden');
        render();
      } catch(err) { alert('파일 오류'); }
    };
    r.readAsText(f);
  });
}

function render() {
  updateHeader();
  const v = $('#mainView');
  if (pref.tab === 'plan') renderPlanTab(v);
  else if (pref.tab === 'list') renderListTab(v);
  else if (pref.tab === 'card') renderCardTab(v);
  else if (pref.tab === 'quiz') renderQuizTab(v);
  else if (pref.tab === 'vprob') renderVProbTab(v);
  else if (pref.tab === 'writing') renderWritingTab(v);
}

$$('.bottom-nav .nav-item').forEach(b => {
  b.addEventListener('click', () => {
    if (b.dataset.tab === 'vprob' && pref.tab === 'vprob') vpSubView = 'home';
    pref.tab = b.dataset.tab;
    savePref();
    render();
    window.scrollTo(0, 0);
  });
});

$('#btnHeaderVProb')?.addEventListener('click', () => {
  vpSubView = 'home';
  pref.tab = 'vprob';
  savePref();
  render();
  window.scrollTo(0, 0);
});
$('#btnTheme').addEventListener('click', () => { pref.dark = !pref.dark; savePref(); updateHeader(); });
$('#btnHeaderBlurMean')?.addEventListener('click', () => {
  pref.blurMean = !pref.blurMean;
  if (pref.tab === 'plan') pref.tab = 'list';
  savePref();
  render();
});
$('#btnSearchModal')?.addEventListener('click', openSearchModal);
$('#btnSyncModal')?.addEventListener('click', openSyncModal);
$('#modalOverlay')?.addEventListener('click', e => { if (e.target.id === 'modalOverlay') $('#modalOverlay').classList.add('hidden'); });

document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
  if (!$('#modalOverlay').classList.contains('hidden')) {
    if (e.key === 'Escape') $('#modalOverlay').classList.add('hidden');
    return;
  }
  if (pref.tab === 'card') {
    if (e.key === ' ') { e.preventDefault(); $('#fcCard')?.click(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); $('#btnNextCard')?.click(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); $('#btnPrevCard')?.click(); }
    else if (e.key === '1') { $('#actBad')?.click(); }
    else if (e.key === '2') { $('#actWarn')?.click(); }
    else if (e.key === '3') { $('#actOk')?.click(); }
  } else if (pref.tab === 'quiz') {
    if (['1','2','3','4'].includes(e.key)) {
      const idx = Number(e.key) - 1;
      const btns = $$('#qChoices .q-choice');
      if (btns[idx]) btns[idx].click();
    } else if (e.key === 'Enter' || e.key === ' ') {
      if ($('#btnNextQuiz')) { e.preventDefault(); $('#btnNextQuiz').click(); }
    }
  } else if (pref.tab === 'vprob' && vpSubView === 'solve') {
    if (e.key === 'Enter') {
      e.preventDefault();
      if ($('#btnVPMSubmit')) $('#btnVPMSubmit').click();
      else if ($('#btnVPMNext')) $('#btnVPMNext').click();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      $('#btnVPMNext')?.click();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      $('#btnVPMPrev')?.click();
    }
  }
});

render();
})();
</script>
